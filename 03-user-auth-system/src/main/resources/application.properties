spring.application.name=03-user-auth-system

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
server.port=8080

# JWT config ─────────────────────────────────────────
# Secret key — must be at least 256 bits (32 chars) for HS256
app.jwt.secret=mySecretKeyForJWTWhichMustBe256BitsLongForHS256Algo12345678
# Token validity in milliseconds — 86400000 = 24 hours
app.jwt.expiration=86400000
